<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Student Registration</h1>
        <p class="subtitle">Please complete all required fields.</p>

        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" name="studentId" placeholder="e.g. 2026-0001" data-required="true" data-label="Student ID">
                <small class="error-message" id="studentIdError"></small>
            </div>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" data-required="true" data-label="Full Name">
                <small class="error-message" id="fullNameError"></small>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" data-required="true" data-label="Email Address">
                <small class="error-message" id="emailError"></small>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="09XXXXXXXXX" data-required="true" data-label="Phone Number">
                <small class="error-message" id="phoneError"></small>
            </div>
            <div class="form-group">
                <label for="birthDate">Date of Birth</label>
                <input type="date" id="birthDate" name="birthDate" data-required="true" data-label="Date of Birth">
                <small class="error-message" id="birthDateError"></small>
            </div>
            <fieldset class="form-group" id="genderGroup">
                <legend>Gender</legend>
                <div class="radio-options">
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                    <label><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
                </div>
                <small class="error-message" id="genderError"></small>
            </fieldset>
            <div class="form-group">
                <label for="program">Program</label>
                <select id="program" name="program" data-required="true" data-label="Program">
                    <option value="">Select your program</option>
                    <option value="BSIT">BS Information Technology</option>
                    <option value="BSCS">BS Computer Science</option>
                    <option value="BSIS">BS Information Systems</option>
                    <option value="BSED">BS Secondary Education</option>
                    <option value="BSBA">BS Business Administration</option>
                </select>
                <small class="error-message" id="programError"></small>
            </div>
            <div class="form-group">
                <label for="yearLevel">Year Level</label>
                <select id="yearLevel" name="yearLevel" data-required="true" data-label="Year Level">
                    <option value="">Select your year level</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                    <option value="5th Year">5th Year</option>
                </select>
                <small class="error-message" id="yearLevelError"></small>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" data-required="true" data-label="Password">
                <small class="error-message" id="passwordError"></small>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Enter your password again" data-required="true" data-label="Confirm Password">
                <small class="error-message" id="confirmPasswordError"></small>
                <button type="button" id="togglePassword" class="secondary-button" aria-pressed="false">Show Passwords</button>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3" placeholder="Enter your complete address" data-required="true" data-label="Address"></textarea>
                <small class="error-message" id="addressError"></small>
            </div>
            <div class="form-group agreement">
                <label for="agreement">
                    <input type="checkbox" id="agreement" name="agreement">
                    I confirm that the information I provided is correct.
                </label>
                <small class="error-message" id="agreementError"></small>
            </div>
            <div id="successMessage" class="success-message" role="status" aria-live="polite"></div>
            <div class="buttons">
                <button type="submit" class="submit-button">Submit Registration</button>
                <button type="reset" class="reset-button">Reset Form</button>
            </div>
        </form>
    </main>
</body>
</html>
